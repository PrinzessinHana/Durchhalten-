<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
>

<meta name="theme-color" content="#fff0f7">

<title>Durchhalten! 💗</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    overflow: hidden;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    background:
        linear-gradient(
            160deg,
            #fff0f7,
            #f7eaff
        );

    display: grid;
    place-items: center;

    color: #444;
}

.card {
    width: min(90vw, 430px);

    padding: 38px 24px 30px;

    background: rgba(255,255,255,.82);

    border-radius: 28px;

    box-shadow:
        0 18px 60px
        rgba(150,70,120,.18);

    text-align: center;

    position: relative;
    z-index: 2;

    backdrop-filter: blur(8px);
}

.tiny {
    font-size: 16px;
    opacity: .72;
    margin-bottom: 12px;
}

h1 {
    margin: 0;

    color: #bd2d70;

    font-size:
        clamp(30px, 9vw, 46px);

    line-height: 1.05;
}

#days {
    font-size:
        clamp(72px, 24vw, 120px);

    font-weight: 900;

    color: #bd2d70;

    line-height: 1;

    margin: 18px 0 4px;
}

.label {
    font-size: 19px;
    font-weight: 700;
}

/* Kleine Wochenanzeige */

.weeks {
    font-size: 14px;

    opacity: .55;

    margin-top: 5px;
}

.message {
    font-size: 25px;

    font-weight: 900;

    margin: 25px 0 20px;
}

button {
    border: 0;

    border-radius: 16px;

    padding: 14px 22px;

    font-size: 17px;

    font-weight: 800;

    background: #ffc1d9;

    color: #6e2046;

    box-shadow:
        0 7px 18px
        rgba(190,45,112,.18);
}

button:active {
    transform: scale(.96);
}

.date {
    font-size: 13px;

    opacity: .55;

    margin-top: 18px;
}


/* KONFETTI */

.confetti {
    position: fixed;

    top: -20px;

    width: 10px;
    height: 16px;

    z-index: 1;

    animation:
        fall linear infinite;
}

@keyframes fall {

    to {
        transform:
            translate3d(
                var(--drift),
                110vh,
                0
            )
            rotate(900deg);
    }
}

</style>
</head>


<body>


<div class="card">

    <div class="tiny">
        ✨ offizieller Durchhalte-Countdown ✨
    </div>


    <h1 id="headline">
        NUR NOCH
    </h1>


    <div id="days">
        ...
    </div>


    <div
        class="label"
        id="dayLabel">
        TAGE!
    </div>


    <div
        class="weeks"
        id="weeks">
    </div>


    <div
        class="message"
        id="message">

        DURCHHALTEN. 💪💗

    </div>


    <button onclick="party()">

        😭 Okay...

    </button>


    <div class="date">

        Ziel: 25.02.2027 🎉

    </div>

</div>



<script>


/* ===========================
   ZIELDATUM
   25.02.2027
   =========================== */

const targetUTC =
    Date.UTC(
        2027,
        1,
        25
    );


/* ===========================
   HEUTE
   =========================== */

const now =
    new Date();

const todayUTC =
    Date.UTC(
        now.getFullYear(),
        now.getMonth(),
        now.getDate()
    );


/* ===========================
   RESTLICHE TAGE
   =========================== */

const msDay =
    1000 * 60 * 60 * 24;


const days =
    Math.max(
        0,
        Math.ceil(
            (targetUTC - todayUTC)
            / msDay
        )
    );


/* ===========================
   ANZEIGE
   =========================== */


if (todayUTC >= targetUTC) {


    document
        .getElementById("headline")
        .textContent =
        "DU HAST ES";


    document
        .getElementById("days")
        .textContent =
        "🎉";


    document
        .getElementById("dayLabel")
        .textContent =
        "GESCHAFFT!";


    document
        .getElementById("weeks")
        .textContent =
        "";


    document
        .getElementById("message")
        .textContent =
        "25.02.2027 💗";


}

else {


    /* TAGE */

    document
        .getElementById("days")
        .textContent =
        days;


    document
        .getElementById("dayLabel")
        .textContent =
        days === 1
        ? "TAG!"
        : "TAGE!";


    /* WOCHEN */

    const weeks =
        (days / 7)
        .toFixed(1)
        .replace(".", ",");


    document
        .getElementById("weeks")
        .textContent =
        "(" + weeks + " Wochen)";


}



/* ===========================
   KONFETTI 🎊
   =========================== */


const colors = [

    "#ff4f9a",

    "#ffd54a",

    "#9c6ade",

    "#40c4ff",

    "#66d17a",

    "#ff8a3d"

];


function confettiPiece(
    burst = false
) {


    const c =
        document.createElement(
            "div"
        );


    c.className =
        "confetti";


    c.style.left =
        (
            Math.random()
            * 100
        )
        + "vw";


    c.style.background =
        colors[
            Math.floor(
                Math.random()
                * colors.length
            )
        ];


    c.style.animationDuration =
        (
            burst
            ? 1.8
                + Math.random() * 2
            : 3
                + Math.random() * 5
        )
        + "s";


    c.style.animationDelay =
        (
            burst
            ? 0
            : Math.random() * -7
        )
        + "s";


    c.style.setProperty(
        "--drift",

        (
            Math.random()
            * 160
            - 80
        )
        + "px"
    );


    c.style.opacity =
        .75
        + Math.random() * .25;


    document.body
        .appendChild(c);


    if (burst) {

        setTimeout(

            () => c.remove(),

            4500

        );

    }

}


/* normales Dauer-Konfetti */

for (
    let i = 0;
    i < 70;
    i++
) {

    confettiPiece();

}


/* ===========================
   KONFETTI-ESKALATION
   BEIM BUTTON 😂
   =========================== */

function party() {


    for (
        let i = 0;
        i < 80;
        i++
    ) {

        confettiPiece(true);

    }

}


</script>


</body>
</html>
